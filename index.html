<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德州撲克 GTO 測驗</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 600px; margin: auto; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .option-btn { display: block; width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; background: white; cursor: pointer; text-align: left; }
        .option-btn:hover { background: #eef2ff; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="scenario">載入中...</h2>
    <p id="question"></p>
    <div id="options"></div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;

    // 1. 抓取 JSON 資料
    fetch('questions.json')
        .then(response => response.json())
        .then(data => {
            questions = data;
            showQuestion(0);
        });

    // 2. 顯示題目
    function showQuestion(index) {
        const q = questions[index];
        document.getElementById('scenario').innerText = q.scenario;
        document.getElementById('question').innerText = q.question;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = ''; // 清空舊選項
        
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            optionsDiv.appendChild(btn);
        });
    }

    // 3. 檢查答案與彈窗
    function checkAnswer(choice) {
        const q = questions[currentIndex];
        if (choice === q.answer) {
            alert("✅ 正確！\n\n" + q.rationale);
            nextQuestion();
        } else {
            alert("❌ 錯誤\n\n解析：" + q.rationale);
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            showQuestion(currentIndex);
        } else {
            alert("恭喜！你已完成所有測試題目。");
            currentIndex = 0;
            showQuestion(0);
        }
    }
</script>

</body>
</html>
